services:
  postgres:
    image: postgres:16
    container_name: eventstore-postgres
    environment:
      POSTGRES_DB: eventstore
      POSTGRES_USER: eventstore
      POSTGRES_PASSWORD: changeme
    ports:
      - "5433:5432"
    volumes:
      - eventstore-postgres-data:/var/lib/postgresql/data

volumes:
  eventstore-postgres-data:
